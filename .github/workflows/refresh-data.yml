name: Refresh parking data

# Rebuilds assets/data/parkfree-data.json from OpenStreetMap and City of Ottawa
# open data. Installed apps download the committed file from
# raw.githubusercontent.com, so new spots reach users without a release.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:data
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/parkfree-data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh parking data"
            git push
          fi
